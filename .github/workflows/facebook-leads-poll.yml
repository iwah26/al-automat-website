name: Poll Facebook webinar leads

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call poll-leads endpoint
        run: |
          curl -sf -X GET "https://www.al-automat.co.il/api/facebook/poll-leads" \
            -H "Authorization: Bearer ${{ secrets.RABANIM_CRON_SECRET }}"
