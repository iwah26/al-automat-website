<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedThin.otf');
    font-weight: 100;
  }
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedLight.otf');
    font-weight: 300;
  }
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedRegular.otf');
    font-weight: 400;
  }
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedMedium.otf');
    font-weight: 500;
  }
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedBold.otf');
    font-weight: 700;
  }
  @font-face {
    font-family: 'FB Basis';
    src: url('file:///Library/Fonts/FbBasis-CondensedBlack.otf');
    font-weight: 900;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html,body {
    width:1080px; height:1080px;
    font-family:'FB Basis', 'Heebo', sans-serif;
    background: linear-gradient(180deg, #2e1e45 0%, #3a2657 50%, #412a62 100%);
    overflow:hidden;
    position:relative;
  }

  .glow {
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
  }
  .glow1 { width:520px; height:520px; background:#7a59a5; top:-160px; right:-160px; }
  .glow2 { width:480px; height:480px; background:#67439a; bottom:-140px; left:-140px; }

  .wrap {
    position:relative;
    z-index:2;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:60px 80px 70px;
  }

  .top { display:flex; flex-direction:column; align-items:center; gap:22px; }
  .middle { display:flex; flex-direction:column; align-items:center; }

  .logo-top {
    height:38px;
  }

  .portrait-wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .portrait {
    width:190px;
    height:190px;
    border-radius:50%;
    object-fit:cover;
    object-position:50% 15%;
    border:3px solid #b9a3dd;
    box-shadow:0 0 0 8px rgba(122,89,165,0.22);
  }
  .presenter-name {
    color:#f3ecff;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .presenter-role {
    color:#c3b0e0;
    font-size:19px;
    font-weight:400;
    margin-top:-8px;
  }

  .badge {
    background: rgba(122,89,165,0.25);
    border: 1.5px solid #8081be;
    color:#e8e4f5;
    font-size:24px;
    font-weight:500;
    padding:9px 26px;
    border-radius:999px;
    letter-spacing:0.5px;
  }

  .headline {
    text-align:center;
    font-size:72px;
    font-weight:900;
    color:#ffffff;
    line-height:1.14;
  }
  .headline .accent {
    background: linear-gradient(90deg, #ffffff 0%, #b9a3dd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subline {
    text-align:center;
    font-size:38px;
    font-weight:700;
    color:#ffffff;
    max-width:750px;
    line-height:1.4;
  }

  .divider {
    width:110px;
    height:4px;
    background:#7a59a5;
    border-radius:2px;
    margin:28px 0;
  }

  .bullets {
    display:flex;
    flex-direction:column;
    gap:20px;
    width:100%;
    max-width:800px;
  }
  .bullet {
    display:flex;
    align-items:center;
    gap:20px;
    background: rgba(84,54,126,0.45);
    border-radius:20px;
    padding:22px 32px;
    font-size:30px;
    font-weight:500;
    color:#ffffff;
  }
  .bullet .icon {
    font-size:34px;
    flex-shrink:0;
  }

  .spacer { flex:1; }

  .footer {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .details {
    font-size:34px;
    font-weight:700;
    color:#ffffff;
    text-align:center;
    line-height:1.5;
  }
  .details .sep { color:#8081be; margin:0 14px; }

  .pill {
    background:transparent;
    border:2px solid #7a59a5;
    color:#fff;
    font-size:28px;
    font-weight:700;
    padding:12px 32px;
    border-radius:999px;
  }
</style>
</head>
<body>
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>
  <div class="wrap">
    <div class="top">
      <img class="logo-top" src="file:///Users/Isaac/Isaac%20Power/projects/%D7%90%D7%95%D7%98%D7%95%D7%9E%D7%A6%D7%99%D7%94/13.05.26-al_automat_website/public/logo-rect.svg">
      <div class="portrait-wrap">
        <img class="portrait" src="file:///Users/Isaac/Judaismo/Rabinato/Foto%20perfil%20m%C3%ADa/DavidMichaeli-7050%20fondo%20transparente.png">
        <div>
          <div class="presenter-name">הרב יצחק ווחנון</div>
        </div>
      </div>
      <div class="badge">סדנה מעשית · שני מפגשים בזום</div>
    </div>

    <div class="middle">
      <div class="headline">
        Claude Code<br><span class="accent">לרבנים</span>
      </div>
      <div class="divider"></div>
      <div class="subline">בנייה עצמית<br>מערכת לניהול הקהילה</div>
    </div>

    <div class="footer">
      <div class="details">12.7 + 19.7<span class="sep">|</span>18:00–21:00<span class="sep">|</span>בזום</div>
      <div class="pill">30 מקומות בלבד</div>
    </div>
  </div>
</body>
</html>
